<!DOCTYPE html>
<html>

<head>
    <title>{{ title }}</title>
</head>
<style>
    body {
        background-color: #181a1b;
        color: #e8e6e3;
        font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
        margin: 0;
        padding: 0;
        transition: background 0.3s, color 0.3s;
    }

    .container {
        max-width: 800px;
        margin: 40px auto;
        padding: 32px;
        background: #23272a;
        border-radius: 12px;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.3);
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        color: #f3f3f3;
    }

    a {
        color: #6cb2eb;
        text-decoration: none;
        transition: color 0.2s;
    }

    a:hover {
        color: #1e90ff;
        text-decoration: underline;
    }

    .search-input {
        flex: 1;
        padding: 12px 16px;
        border-radius: 8px;
        border: none;
        font-size: 1.1rem;
        background: #23272a;
        color: #e8e6e3;
        outline: none;
        transition: background 0.3s, color 0.3s
    }

    .search-form {
        max-width: 800px;
        margin: 32px auto 0 auto;
        display: flex;
        gap: 12px;
    }

    body.light-mode .search-input {
        background: #f6f6f6;
        color: #23272a;
        border: 1px solid #ccc;
    }

    button.search-submit {
        padding: 12px 24px;
        border-radius: 8px;
        border: none;
        background: #820000;
        color: #23272a;
        font-size: 1.1rem;
        cursor: pointer;
        transition: background 0.3s;
    }

    body.light-mode button.search-submit {
        background: #ff4c4c;
        color: #fff;
    }

    button.search-submit.light-mode {
        background: #ff4c4c;
        color: #fff;
    }

    .toggle-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #23272a;
        color: #e8e6e3;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        transition: background 0.3s, color 0.3s;
    }

    body.light-mode {
        background: #f6f6f6;
        color: #23272a;
    }

    body.light-mode .container {
        background: #fff;
        color: #23272a;
    }

    body.light-mode .toggle-btn {
        background: #e8e6e3;
        color: #23272a;
    }

    body.light-mode h1 {
        color: #000;
    }
</style>
<script>
    function toggleMode() {
        document.body.classList.toggle('light-mode');
        document.body.classList.contains('light-mode') ?
            document.querySelector('.toggle-btn').innerText = '🌙' :
            document.querySelector('.toggle-btn').innerText = '☀️';
        localStorage.setItem(
            'mode', document.body.classList.contains('light-mode') ?
            'light' :
            'dark');
    }
    window.onload = function () {
        if (localStorage.getItem('mode') === 'light') {
            document.body.classList.add('light-mode');
        }
    }
</script>
</head>

<body>
    <button class="toggle-btn" onclick="toggleMode()">☀️</button>
    <form action="/wiki/search" method="get" class="search-form">
        <input type="text" name="q" placeholder="search localwiki" class="search-input">
        <button type="submit" class="search-submit">Search</button>
    </form>
    <div class="container">
        {{ article|safe }}
    </div>
</body>

</html>
